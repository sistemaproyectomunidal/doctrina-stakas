name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ml-service image
        uses: docker/build-push-action@v4
        with:
          context: ./services/ml-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doctrina-stakas-ml:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/doctrina-stakas-ml:latest

      - name: Build and push social-service image
        uses: docker/build-push-action@v4
        with:
          context: ./services/social-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doctrina-stakas-social:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/doctrina-stakas-social:latest

      - name: Build and push ads-service image
        uses: docker/build-push-action@v4
        with:
          context: ./services/ads-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doctrina-stakas-ads:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/doctrina-stakas-ads:latest
