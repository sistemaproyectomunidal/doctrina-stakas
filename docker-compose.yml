version: '3.8'
services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db
      - minio

  ml-service:
    build: ./services/ml-service
    env_file: .env
    depends_on:
      - db

  social-service:
    build: ./services/social-service
    env_file: .env
    depends_on:
      - db

  ads-service:
    build: ./services/ads-service
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: doctrina
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"

volumes:
  pgdata:
  miniodata:
